<!doctype html>
<html lang="__LOCALE__" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.title">Assistente full-duplex</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262a33; --text: #e6e8ee; --dim: #8a90a0;
    --user: #2b5cff; --bot: #222733; --accent: #7cf29c; --warn: #ffcf5c; --think: #b48cff;
    /* the only localized text in CSS: JS overwrites it from the catalogue */
    --cut: "interrotto";
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }

  /* ── header: state orb + model ── */
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  /* the «assistente vocale» spot is the *assistant's* circle: JS writes --lvl from the
     TTS output, so it swells and glows with its voice, and only with its voice.
     Your own speech never touches it — that is what the circle at the input is for:
     `user` below is deliberately identical to `listening` (no colour, no glow, no
     pulse), so speaking up here changes nothing; only your circle bounces.
     It is pinned to the title's first line instead of being centred against the whole
     two-line block (title + state label): flex-start + the half-leading margin keeps its
     centre exactly on the title's centre, and it can no longer drift down when the state
     label under the title grows, wraps or changes text. */
  #orb { width: 14px; height: 14px; border-radius: 50%; background: #444; flex: none;
    align-self: flex-start;
    margin-top: calc((1.45em - 14px) / 2);   /* (line-height − Ø) / 2 = half-leading */
    transform: scale(calc(1 + var(--lvl, 0) * .55));
    transform-origin: 50% 50%;   /* level scaling grows it in place, never off the line */
    transition: background .2s, box-shadow .2s; }
  #orb.listening { background: var(--accent); box-shadow: 0 0 10px 1px #7cf29c55; }
  /* = listening: while *you* speak the assistant's spot stays exactly as it was */
  #orb.user { background: var(--accent); box-shadow: 0 0 10px 1px #7cf29c55; }
  #orb.thinking { background: var(--think); animation: pulse .7s infinite; }   /* assistant-side, not voice-driven */
  #orb.speaking { background: #ff8c5a;
    box-shadow: 0 0 calc(14px + var(--lvl, 0) * 14px) calc(4px + var(--lvl, 0) * 6px) #ff8c5aaa; }
  #orb.confirm { background: var(--warn); animation: pulse 1.2s infinite; }
  #orb.paused { background: var(--warn); }
  #orb.offline { background: #555; }
  @keyframes pulse { 50% { transform: scale(1.2); } }
  #title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  /* ctx: barra «token usati / n_ctx» accanto al titolo (nascosta se n_ctx è ignoto) */
  #ctxBox { display: inline-flex; align-items: center; gap: 7px; padding: 2px 8px 2px 9px;
            border: 1px solid var(--line); border-radius: 999px; background: #1d212a; }
  #ctxBox[hidden] { display: none; }
  #ctxBar { width: 92px; height: 8px; flex: none; border-radius: 999px;
            background: #0c0e12; box-shadow: inset 0 0 0 1px #39404f; overflow: hidden; }
  #ctxFill { display: block; height: 100%; width: 0; border-radius: inherit;
             background: var(--accent); transition: width .35s ease, background .35s; }
  #ctxFill.warn { background: var(--warn); }
  #ctxFill.hot { background: #ff6b6b; }
  #ctxLabel { font-size: 11px; font-weight: 500; color: var(--dim); white-space: nowrap; }
  /* «1k / 200k»: la barra da sola non dice cosa sia, quindi la parola c'è */
  #ctxText { font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap;
             font-variant-numeric: tabular-nums; }
  /* la barra per prima (a sinistra), poi «2%», poi i numeri assoluti */
  #ctxPct { font-size: 11px; font-weight: 600; color: var(--dim); white-space: nowrap;
            font-variant-numeric: tabular-nums; min-width: 30px; text-align: right; }
  #modeBadge { display: none; font-size: 11px; font-weight: 500; color: var(--accent);
    border: 1px solid #7cf29c55; border-radius: 999px; padding: 1px 8px; }
  #modeBadge.on { display: inline-block; }
  #stateLabel { color: var(--dim); font-size: 13px; }
  #modelBox { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
  #modelRefresh { padding: 5px 9px; border-radius: 8px; font-size: 14px; line-height: 1;
    color: var(--dim); background: transparent; }
  #modelRefresh:hover { color: var(--think); border-color: var(--think); }
  #modelRefresh:disabled { opacity: .7; cursor: wait; }
  #textIn:disabled, #sendBtn:disabled { opacity: .45; cursor: not-allowed; }
  #modelRefresh.spin .glyph { animation: spin .9s linear infinite; }
  /* the assistant's voice mute: its own button, left of ↻ — the mic button stays independent */
  #voiceBtn { padding: 5px 9px; border-radius: 8px; font-size: 14px; line-height: 1; }
  #voiceBtn:hover { color: var(--accent); border-color: var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* su schermi stretti sparisce solo la parola «ctx»: i numeri assoluti
     («1k / 200k») restano, perché sono il motivo per cui la barra esiste */
  @media (max-width: 899px) { #ctxLabel { display: none; } }
  #modelSel { max-width: 260px; padding: 6px 8px; font-size: 13px; }
  #modelSel.filtering { border-color: var(--think); }   /* a query typed into it is active */
  /* narrow screens: the whole model row (🔊 ↻ modello ⚙, the right-hand panel) drops on
     a line of its own and the selector shrinks, instead of dragging the header past the
     right edge of the viewport */
  @media (max-width: 699px) {
    header { flex-wrap: wrap; row-gap: 8px; }
    #modelBox { flex: 1 0 100%; }
    #modelSel { max-width: none; flex: 1; min-width: 0; }
  }

  /* ── chat ── */
  main { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  /* the chat's scrollbar: transparent track (the chat's own background shows through),
     only a slim thumb. The standard pair covers Chromium 121+ / Firefox; the ::-webkit
     block is the fallback for older engines that ignore scrollbar-color/width. */
  main { scrollbar-width: thin; scrollbar-color: #3a4152 transparent; }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-track, main::-webkit-scrollbar-corner { background: transparent; }
  main::-webkit-scrollbar-thumb { background: #3a4152; border-radius: 999px;
    border: 2.5px solid transparent; background-clip: padding-box; }
  main::-webkit-scrollbar-thumb:hover { background: #4b5266; background-clip: padding-box; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap;
         position: relative; }   /* ⟲ hangs from the bubble's top corner */
  .user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .bot.cut::after { content: "  ✂ " var(--cut); color: var(--warn); font-size: 12px; }
  .info { font-size: 11px; color: #c9d4ff99; margin-top: 3px; }
  .bot .info { color: var(--dim); }
  /* ⟲ rewind the conversation to this line: a round button in the bubble's top corner,
     there only while the pointer is on the bubble (always a little visible where there is
     no hover at all). One per line the server gave a checkpoint id to. */
  .msg .rew { position: absolute; top: -10px; width: 22px; height: 22px; padding: 0;
    border-radius: 50%; background: #1b1f29; opacity: 0; transition: opacity .12s;
    display: inline-flex; align-items: center; justify-content: center; }
  /* the ⟲ glyph is the character itself, not an SVG: the round button centres it */
  .msg .rew .glyph { width: auto; height: auto; font-size: 15px; line-height: 1; }
  .msg:hover .rew, .msg .rew:focus-visible { opacity: 1; }
  .msg .rew:hover { color: var(--warn); border-color: var(--warn); }
  .msg .rew:disabled { opacity: .4; cursor: wait; }
  .user .rew { right: 8px; }
  .bot .rew { left: 8px; }
  @media (hover: none) { .msg .rew { opacity: .6; } }
  .event { align-self: center; color: var(--dim); font-size: 12px; text-align: center; }
  #partial { min-height: 26px; padding: 4px 18px; color: #9db8ff; font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── the banner above the chat: a chip per pending timer / running command, each with
     its own ✕. It is a flex row that wraps, so ten chips never push the chat sideways. */
  #taskBar { flex: none; display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
    padding: 8px 14px; background: #141821; border-bottom: 1px solid var(--line); }
  #taskBar[hidden] { display: none; }
  .taskChip { display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
    min-width: 0; padding: 4px 5px 4px 11px; border: 1px solid #3a4152;
    border-radius: 999px; background: #1b2130; font-size: 12.5px; }
  .taskChip .ico { flex: none; }
  .taskChip .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 46ch; }
  /* the countdown: tabular figures so a second ticking by never nudges the ✕ next to it */
  .taskChip .left { flex: none; color: var(--warn); font-weight: 600; font-size: 12px;
    font-variant-numeric: tabular-nums; }
  .taskChip .x { flex: none; display: inline-flex; align-items: center; padding: 3px 6px;
    border-radius: 999px; color: var(--dim); background: transparent; }
  .taskChip .x .glyph { width: 13px; height: 13px; }
  .taskChip .x:hover { color: #ff8f8f; border-color: #7a2f2f; }
  .taskChip .x:disabled { opacity: .5; cursor: wait; }

  /* ── command cards ── */
  .cmd { align-self: flex-start; max-width: 88%; background: #1b1f29;
    border: 1px solid #343b4d; border-radius: 12px; padding: 9px 12px; font-size: 13px; }
  .cmd.pending { border-color: var(--warn); }
  .cmd code { display: block; font: 13px/1.4 ui-monospace, "JetBrains Mono", monospace;
    color: #ffd98a; white-space: pre-wrap; word-break: break-all; margin: 4px 0; }
  .cmd .why, .cmd .status { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .cmd .btns { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .cmd .btns button { padding: 5px 12px; display: inline-flex; align-items: center; gap: 7px; }
  .cmd .ok { border-color: #2f7a46; } .cmd .no { border-color: #7a2f2f; }
  .cmd details { margin-top: 6px; }
  .cmd details pre { max-height: 260px; overflow: auto; background: #0b0d11; padding: 8px;
    border-radius: 8px; font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap;
    margin: 6px 0 0; }

  /* ── tool-call cards: one header line, the details collapsed ── */
  .tool { align-self: flex-start; max-width: 88%; background: #141821;
    border: 1px solid #2a3140; border-radius: 12px; padding: 7px 11px; font-size: 13px; }
  .tool .head { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .tool .name { font-weight: 600; color: #9fd3ff; flex: none; }
  .tool .sum { color: var(--dim); font: 12px/1.4 ui-monospace, "JetBrains Mono", monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .tool .badge { margin-left: auto; font-size: 11px; color: var(--dim); white-space: nowrap;
    flex: none; }
  .tool.done .badge { color: var(--accent); }
  .tool.err { border-color: #7a2f2f; }
  .tool.err .badge { color: #ff8f8f; }
  .tool.blocked { border-color: #7a5f2f; }
  .tool.blocked .badge { color: #ffc88f; }
  .tool details { margin-top: 6px; }
  .tool summary { cursor: pointer; color: var(--dim); font-size: 12px; user-select: none; }
  .tool summary:hover { color: var(--text); }
  .tool .lbl { color: var(--dim); font-size: 10px; text-transform: uppercase;
    letter-spacing: .06em; margin-top: 7px; }
  .tool pre { background: #0b0d11; padding: 7px 9px; border-radius: 8px; margin: 3px 0 0;
    font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word;
    max-height: 220px; overflow: auto; }
  .tool .meta { color: var(--dim); font-size: 11px; margin-top: 5px; }

  /* ── 💭 reasoning: its own block, collapsed by default, one per turn ── */
  .think { align-self: flex-start; max-width: 78%; background: #141821;
    border: 1px solid #2a3140; border-radius: 12px; padding: 6px 10px; }
  .think summary { display: flex; align-items: baseline; gap: 7px; cursor: pointer;
    color: var(--think); font-size: 12px; user-select: none; list-style: none; }
  .think summary::-webkit-details-marker { display: none; }
  .think summary::before { content: "▸"; color: var(--dim); }
  .think[open] summary::before { content: "▾"; }
  .think summary .ico { flex: none; }
  .think summary .cnt { color: var(--dim); flex: none; }
  .think.busy summary .cnt { animation: thinkBlink .9s infinite; }
  @keyframes thinkBlink { 50% { opacity: .35; } }
  .think summary .peek { color: var(--dim); font-style: italic; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .think .body { margin-top: 6px; background: #0b0d11; border-left: 2px solid #7c5cff66;
    border-radius: 6px; padding: 7px 9px; max-height: 260px; overflow: auto;
    font: 12px/1.45 ui-monospace, "JetBrains Mono", monospace;
    white-space: pre-wrap; word-break: break-word; color: #aab2c8; }

  /* ── settings drawer: it drops from the header, right under the ⚙ button ── */
  #settings { display: none; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 13px 16px 16px; gap: 13px; flex-direction: column; overflow-y: auto;
    max-height: min(66vh, 560px); }
  #settings.open { display: flex; animation: drawerIn .16s ease-out; }
  @keyframes drawerIn { from { opacity: 0; transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { #settings.open { animation: none; } }
  #settings .setHead { display: flex; align-items: center; gap: 10px;
    padding-bottom: 11px; border-bottom: 1px solid var(--line); }
  /* the cards live in a grid of their own: with only auto-fit tracks here, the header's
     `1 / -1` span would keep an unused column from collapsing (a hole on the right) */
  #settings .cards { display: grid; gap: 13px;
    grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); }
  #settings .ttl { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  #settings .ttl .glyph { width: 16px; height: 16px; color: var(--think); }
  /* the ✕ always sits on the far right (with the hint just to its left when there is one) */
  #settings .hint { color: var(--dim); font-size: 11.5px; text-align: right; }
  #settings .setHead > button { margin-left: auto; }

  /* one card per topic: title on top, a row per control (switch right, selector full width) */
  #settings .grp { background: #1b1f29; border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  #settings .grpTtl { display: flex; align-items: center; gap: 7px; font-size: 11px;
    font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #settings .grpTtl .glyph { width: 14px; height: 14px; color: var(--think); }
  #settings .row { display: flex; align-items: center; justify-content: space-between;
    gap: 12px; color: var(--text); font-size: 13px; cursor: pointer; min-width: 0; }
  #settings .row.col { flex-direction: column; align-items: stretch; gap: 6px; cursor: default; }
  #settings .row .txt { min-width: 0; }
  #settings .row small { display: block; color: var(--dim); font-size: 11px; line-height: 1.4;
    margin-top: 2px; }
  #settings select { padding: 6px 9px; font-size: 13px; width: 100%; min-width: 0; }

  /* the checkbox is still the checkbox — only its skin is a switch, so every handler,
     test and `checked` read keeps working unchanged */
  #settings input.sw { appearance: none; -webkit-appearance: none; margin: 0; flex: none;
    position: relative; width: 38px; height: 21px; border-radius: 999px; cursor: pointer;
    background: #262b38; border: 1px solid var(--line);
    transition: background .16s, border-color .16s; }
  #settings input.sw::after { content: ""; position: absolute; top: 2px; left: 2px;
    width: 15px; height: 15px; border-radius: 50%; background: var(--dim);
    transition: transform .16s, background .16s; }
  #settings input.sw:checked { background: #1e3d2b; border-color: var(--accent); }
  #settings input.sw:checked::after { transform: translateX(17px); background: var(--accent); }
  #settings input.sw:focus-visible { outline: 2px solid var(--think); outline-offset: 2px; }
  @media (max-width: 699px) { #settings .hint { display: none; } }

  /* ── skills: the checkbox list of SKILLS_DIR (only the ticked ones reach the model) ── */
  #skillsBox { background: #1b1f29; border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 13px 12px; }
  #skillsBox .hd { font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim); display: flex; gap: 8px;
    align-items: center; min-width: 0; }
  #skillsBox .hd .glyph { width: 14px; height: 14px; color: var(--think); }
  #skillsBox .hd span { color: var(--dim); font: 11px ui-monospace, "JetBrains Mono", monospace;
    text-transform: none; letter-spacing: 0; font-weight: 400; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #skillList { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  #skillList label { color: var(--text); font-size: 12.5px; display: inline-flex;
    align-items: center; gap: 7px; cursor: pointer; padding: 4px 11px 4px 9px;
    border: 1px solid var(--line); border-radius: 999px; background: #151923;
    transition: border-color .12s, background .12s, color .12s; }
  #skillList label:hover { border-color: #3a4152; }
  #skillList label.off { color: var(--dim); background: transparent; }
  #skillList input { margin: 0; accent-color: var(--accent); cursor: pointer; }
  #skillList .empty { color: var(--dim); font-size: 12px; font-style: italic; }

  /* ── footer ── */
  /* grid, one row, document order = column order: pulsing circle · text field ·
     the 4 icon buttons (send, mic, stop, reset) */
  footer { display: grid; grid-template-columns: auto minmax(0, 1fr) repeat(4, max-content);
    gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line);
    background: var(--panel); align-items: center; }
  /* the pulsing circle left of the input: JS writes --lvl on every animation frame
     from the mic peak — it is the *user's* voice, so it stays blue. The assistant's
     own level drives the header orb instead (see the top of this stylesheet). */
  #talkDot { --lvl: 0; width: 13px; height: 13px; border-radius: 50%; flex: none;
    justify-self: center; color: #4f8cff; background: currentColor;
    opacity: calc(.4 + var(--lvl) * .6);
    transform: scale(calc(1 + var(--lvl) * .9));
    box-shadow: 0 0 calc(var(--lvl) * 16px) calc(var(--lvl) * 5px) currentColor; }
  #textIn { width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: inherit; }
  button, select { background: #232835; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3a4152; }
  button.off { color: var(--warn); border-color: var(--warn); }
  /* monochrome icon buttons: one inline SVG per icon, stroked with currentColor, so a
     button's state (hover / .off / aria-expanded) colours the glyph too. No emoji. */
  .glyph { width: 17px; height: 17px; display: block; flex: none;
    fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round; }
  button.iconBtn { padding: 7px; display: inline-flex; align-items: center;
    justify-content: center; }
  /* a toggling button carries both states: `.off` (muted) shows the second one */
  .iconBtn .i-off { display: none; }
  .iconBtn.off .i-on { display: none; }
  .iconBtn.off .i-off { display: block; }
  #settingsBtn[aria-expanded="true"] { border-color: var(--think); color: var(--think); }

  #overlay { position: fixed; inset: 0; background: #0f1115ee; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
  #overlay button { font-size: 18px; padding: 14px 26px; display: inline-flex;
    align-items: center; gap: 10px; }
  #overlay .glyph { width: 20px; height: 20px; }
</style>
</head>
<body>
<header>
  <div id="orb" class="offline"></div>
  <div>
    <div id="title"><span data-i18n="ui.title">Assistente vocale</span> <span id="modeBadge">pi CLI</span><span id="ctxBox"
      data-i18n-title="ctx.title.short" title="ctx: token usati su n_ctx"><span id="ctxLabel">ctx</span
      ><span id="ctxBar"><span id="ctxFill"></span></span
      ><span id="ctxPct"></span><span id="ctxText"></span></span></div>
    <div id="stateLabel" data-i18n="state.connecting">connessione…</div>
  </div>
  <div id="modelBox">
    <button id="voiceBtn" type="button" class="iconBtn"
            data-i18n-title="hdr.voice.title" data-i18n-aria="hdr.voice.aria"
            title="Voce dell'assistente on/off — spegne solo la riproduzione, il microfono resta attivo"
            aria-label="Voce dell'assistente on/off" aria-pressed="true">
      <svg class="glyph i-on" viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <svg class="glyph i-off" viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    </button>
    <button id="modelRefresh" type="button" class="iconBtn"
            data-i18n-title="hdr.refresh.title" data-i18n-aria="hdr.refresh.aria"

            aria-label="Aggiorna elenco modelli">

const CAPTURE_WORKLET = `
class Capture extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(512); this.n = 0; this.peak = 0; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) for (let i = 0; i < ch.length; i++) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      this.peak = Math.max(this.peak, Math.abs(s));
      this.buf[this.n++] = s * 32767;
      if (this.n === 512) {
        const out = this.buf; this.buf = new Int16Array(512); this.n = 0;
        this.port.postMessage({ pcm: out.buffer, peak: this.peak }, [out.buffer]);
        this.peak = 0;
      }
    }
    return true;
  }
}
registerProcessor('capture', Capture);`;

const PLAYER_WORKLET = `
class Player extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ring = new Float32Array(sampleRate * 60); this.r = 0; this.w = 0; this.started = false;
    this.port.onmessage = (e) => {
      if (e.data.flush) { this.r = this.w = 0; this.started = false; return; }
      const pcm = new Int16Array(e.data.pcm);
      for (let i = 0; i < pcm.length; i++) {
        this.ring[this.w] = pcm[i] / 32768; this.w = (this.w + 1) % this.ring.length;
      }
    };
  }
  avail() { return (this.w - this.r + this.ring.length) % this.ring.length; }
  process(_in, outputs) {
    const out = outputs[0][0];
    // small jitter buffer (~60 ms) before starting a burst, to avoid crackles
    if (!this.started && this.avail() < sampleRate * 0.06) { out.fill(0); return true; }
    this.started = true;
    for (let i = 0; i < out.length; i++) {
      if (this.r === this.w) { out[i] = 0; this.started = false; continue; }
      out[i] = this.ring[this.r]; this.r = (this.r + 1) % this.ring.length;
    }
    return true;
  }
}

// Every chat line the server put in its history carries an id (`hello.history`, the `user`

// server kept for a reason of its own (a turn `fitHistory` shed while this page was open):
// the cut is taken from the *last* line the server still has, never from the first one it

// ── context meter (token usati / n_ctx, la barra accanto al titolo) ──
// La barra compare solo con un denominatore certo: se l'endpoint non riporta l'n_ctx
// (total = 0) sparisce, perché una barra senza totale sarebbe un inganno.
let lastCtx = null;          // l'ultima coppia {used,total} ricevuta: diagnostica in console
function onContext(ev) {
  const box = $("ctxBox");
  const total = Math.max(0, Math.round(ev.total || 0));
  const used = Math.max(0, Math.round(ev.used || 0));
  lastCtx = { used, total };
  if (!total) { box.hidden = true; return; }
  const pct = Math.min(100, (used / total) * 100);
  const fill = $("ctxFill");
  box.hidden = false;
  fill.style.width = pct.toFixed(1) + "%";
  fill.className = pct >= 90 ? "hot" : pct >= 70 ? "warn" : "";
  $("ctxText").textContent = `${tok(used)} / ${tok(total)}`;
  $("ctxPct").textContent = pct.toFixed(0) + "%";
  $("ctxPct").style.color = pct >= 90 ? "#ff6b6b" : pct >= 70 ? "var(--warn)" : "";
  box.title = tf("ctx.title", {
    used: used.toLocaleString(NUM),
    total: total.toLocaleString(NUM),
    pct: pct.toFixed(0),
  });
}

// 950 → «950», 1000 → «1k», 32768 → «32,8k»/«32.8k», 1_500_000 → «1,5M»/«1.5M»: la barra
// sta in 92 px, i numeri interi non ci starebbero. k/M come li arrotonda il CLI pi:
// potenze di dieci, un decimale, il separatore decimale della lingua attiva.
function tok(n) {
  if (n < 1e3) return String(n);
  const [v, k] = n >= 1e6 ? [n / 1e6, "M"] : [n / 1e3, "k"];
  const [whole, frac] = v.toFixed(1).split(".");
  return whole + (frac === "0" ? "" : (LOCALE === "it" ? "," : ".") + frac) + k;
}

// ── voices (the selector in the settings drawer) ──
// One entry per preset of the TTS pack; the server echoes the list back (`voices` event)
// when a pick is refused, so the selector can never show a voice the pack has not.
function fillVoices(voices, current, hz) {
  const sel = $("voiceSel");
  const list = voices && voices.length ? voices : [current || "giovanni"];
  sel.innerHTML = "";
  for (const v of list) {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  }
  if (current) sel.value = current;
  $("voiceMeta").textContent = tf("voice.meta", { hz: hz || rate, n: list.length });
}

// ── skills (checkbox list in the settings drawer) ──
// The server only ever sends the skills found in SKILLS_DIR; which of them are *active*
// is the user's choice, and only those reach the model's context (prompt + tools).
let skillRows = [], skillsDirText = "";
function fillSkills(list, dir) {
  skillRows = list || [];
  if (dir !== undefined && dir !== null) skillsDirText = dir || "";
  const box = $("skillList");
  box.innerHTML = "";
  if (!skillRows.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = skillsDirText
      ? tf("skills.empty.in", { dir: skillsDirText })
      : t("skills.empty");
    box.appendChild(d);
  }
  for (const s of skillRows) {
    const l = document.createElement("label");
    l.title = s.description;
    l.classList.toggle("off", !s.active);
    const c = document.createElement("input");
    c.type = "checkbox";
    c.checked = !!s.active;
    c.onchange = () => {
      s.active = c.checked;
      l.classList.toggle("off", !s.active);
      send({ type: "skills_set",
             active: skillRows.filter((x) => x.active).map((x) => x.name) });
    };
    l.appendChild(c);
    l.appendChild(document.createTextNode(s.name));
    box.appendChild(l);
  }
  const dirEl = $("skillsDir");
  if (dirEl) dirEl.textContent = skillsDirText;
}

// ── models ──
let currentModel = "", viaPi = false, modelRefreshPending = false, modelList = [];
// The dropdown holds every model pi can reach (100+), so it filters itself: type straight
// into the selector (no separate box) and the query becomes its own first, disabled line:
//   🔍 «gemma» · 5 di 120    Backspace edits it, Esc clears it, picking a model clears it.
const FILTER_MARK = "__filter__";
let modelQuery = "", modelTitleBase = t("model.api.title");

function applyModelFilter() {
  const sel = $("modelSel");
  const q = modelQuery.trim();
  const hits = q ? modelList.filter(m => m.toLowerCase().includes(q.toLowerCase()))
                 : modelList.slice();
  const matched = hits.length;
  sel.innerHTML = "";
  if (q) {                                          // the query lives inside the selector
    const head = document.createElement("option");
    head.value = FILTER_MARK;
    head.disabled = true;
    head.textContent = tf("model.filter.head", { q, n: matched, total: modelList.length });
    sel.appendChild(head);
  }
  // the active model stays reachable even when the query hides it — appended *last*, so
  // the first line under the query is always the first real match (what Enter picks)
  if (currentModel && !hits.includes(currentModel)) hits.push(currentModel);
  for (const m of hits) {
    const o = document.createElement("option");
    o.value = o.textContent = m;
    sel.appendChild(o);
  }
  if (q) sel.value = FILTER_MARK;
  else if (hits.length) sel.value = hits.includes(currentModel) ? currentModel : hits[0];
  sel.classList.toggle("filtering", !!q);
  sel.title = modelTitleBase + (q
    ? tf("model.filter.title", { q, n: matched, total: modelList.length })
    : tf("model.list.title", { n: modelList.length }));
}

function fillModels(models, current, usePi) {
  if (!!usePi !== viaPi) modelQuery = "";           // other leg → other model names
  currentModel = current;
  viaPi = !!usePi;
  modelList = models.slice();
  modelTitleBase = viaPi ? t("model.pi.title") : t("model.api.title");
  applyModelFilter();
  $("modelSel").disabled = false;
  $("modeBadge").classList.toggle("on", viaPi);
}

// ── audio setup ──
async function setupAudio() {
  // playback context at the TTS rate
  playCtx = new AudioContext({ sampleRate: rate, latencyHint: "interactive" });
  await playCtx.audioWorklet.addModule(workletURL(PLAYER_WORKLET));
  playerNode = new AudioWorkletNode(playCtx, "player", { outputChannelCount: [1] });
  playerGain = playCtx.createGain();             // the one mute point for the assistant's voice
  playerNode.connect(playerGain);
  playerGain.connect(playCtx.destination);       // audible immediately; loopback upgrades it
  playerGain.gain.value = voiceOn ? 1 : 0;        // honour the 🔊 mute from the first frame
  // tap the player *before* the gain node: playerGain is disconnected/reconnected by every
  // routing switch (direct ⇄ AEC loopback), playerNode never is. Feeds the pulsing dot.
  analyser = playCtx.createAnalyser();
  analyser.fftSize = 1024;
  playerNode.connect(analyser);
  playTap = new Float32Array(analyser.fftSize);
  playbackMode = "init";
  await routePlayback($("aecChk").checked);

  // capture: Chromium's own echo cancellation / noise suppression / AGC
  micStream = await navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  micCtx = new AudioContext({ sampleRate: 16000, latencyHint: "interactive" });
  await micCtx.audioWorklet.addModule(workletURL(CAPTURE_WORKLET));
  const src = micCtx.createMediaStreamSource(micStream);
  const cap = new AudioWorkletNode(micCtx, "capture");
  cap.port.onmessage = (e) => {
    micLvl = micOn ? Math.min(1, e.data.peak * 1.4) : 0;   // 31 msg/s → the dot's mic level
    if (micOn && ws && ws.readyState === 1) ws.send(e.data.pcm);
  };
  src.connect(cap);
  // keep the graph pulled without making the mic audible
  const sink = micCtx.createGain(); sink.gain.value = 0; cap.connect(sink); sink.connect(micCtx.destination);
  if (playCtx.state !== "running" || micCtx.state !== "running") throw new Error("suspended");
}

// Route TTS through a local WebRTC loopback so Chromium's AEC uses it as the echo reference.
// WebRTC never uses 127.0.0.1: it needs a real interface address (e.g. wlan0). Offline, or when
// Wi-Fi drops, ICE can't connect → audio would be silent. So: verify the loopback connects,
// otherwise (or when it fails later) play directly, and retry the loopback when the network returns.
let playbackMode = "direct", retryTimer = null;
function closeLoopback() {
  if (!loopback) return;
  loopback.pc1.close(); loopback.pc2.close(); loopback.audio.srcObject = null; loopback = null;
}
function playDirect(reason) {
  closeLoopback();
  playerGain?.disconnect();
  playerGain?.connect(playCtx.destination);
  if (playbackMode !== "direct" && reason) addEvent(tf("audio.direct", { reason }));
  playbackMode = "direct";
  clearTimeout(retryTimer);
  if ($("aecChk").checked) retryTimer = setTimeout(() => routePlayback(true), 15000);
}
async function routePlayback(useLoopback) {
  clearTimeout(retryTimer);
  if (!useLoopback) { playDirect(""); clearTimeout(retryTimer); return; }
  if (!navigator.onLine && playbackMode !== "loopback") {   // no interface up: don't even try
    playDirect(playbackMode === "direct" ? "" : t("audio.offline"));
    return;
  }
  closeLoopback();
  try {
    const dest = playCtx.createMediaStreamDestination();
    const pc1 = new RTCPeerConnection(), pc2 = new RTCPeerConnection();
    pc1.onicecandidate = (e) => e.candidate && pc2.addIceCandidate(e.candidate).catch(() => {});
    pc2.onicecandidate = (e) => e.candidate && pc1.addIceCandidate(e.candidate).catch(() => {});
    const audio = new Audio(); audio.autoplay = true;
    pc2.ontrack = (e) => { audio.srcObject = e.streams[0]; audio.play().catch(() => {}); };
    dest.stream.getTracks().forEach((track) => pc1.addTrack(track, dest.stream));
    const offer = await pc1.createOffer();
    await pc1.setLocalDescription(offer); await pc2.setRemoteDescription(offer);
    const answer = await pc2.createAnswer();
    await pc2.setLocalDescription(answer); await pc1.setRemoteDescription(answer);
    const connected = await new Promise((resolve) => {
      if (pc1.connectionState === "connected") return resolve(true);
      const timeout = setTimeout(() => resolve(false), 2000);
      pc1.addEventListener("connectionstatechange", () => {
        if (pc1.connectionState === "connected") { clearTimeout(timeout); resolve(true); }
        if (pc1.connectionState === "failed") { clearTimeout(timeout); resolve(false); }
      });
    });
    if (!connected) { pc1.close(); pc2.close(); playDirect(t("audio.loopFail")); return; }
    // switch only once the loopback really carries audio
    playerGain.disconnect();
    playerGain.connect(dest);
    loopback = { pc1, pc2, audio };
    if (playbackMode !== "loopback" && playbackMode !== "init") addEvent(t("audio.loopOn"));
    playbackMode = "loopback";
    pc1.addEventListener("connectionstatechange", () => {
      if (loopback && loopback.pc1 === pc1 &&
          (pc1.connectionState === "failed" || pc1.connectionState === "disconnected")) {
        playDirect(t("audio.loopLost"));
      }
    });
  } catch (err) {
    console.warn("loopback failed, direct output", err);
    playDirect(t("audio.loopNone"));
  }
}
window.addEventListener("offline", () => playbackMode === "loopback" && playDirect(t("audio.noNet")));
window.addEventListener("online", () => $("aecChk").checked && playbackMode !== "loopback" && routePlayback(true));

// ── websocket ──
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { clearTimeout(reconnectTimer); };
  ws.onclose = (e) => {
    setState("offline");
    // The server closes the losing side with 1000 "replaced by a new client" when a second
    // window/tab opens (only one client is fed). Reconnecting would kick *that* one back and
    // the two would ping-pong every 1.5 s forever — and each new connection calls
    // stopActivity() server-side, which silently kills the answer being generated. So the
    // kicked page stays put and says so; a reload takes the slot again.
    if (takenOver) return;
    if (e.code === 1000 && (e.reason || "").startsWith("replaced")) {
      onSessionTaken();
      return;
    }
    reconnectTimer = setTimeout(connect, 1500);
  };
  ws.onmessage = async (e) => {
    if (typeof e.data !== "string") { playerNode && playerNode.port.postMessage({ pcm: e.data }, [e.data]); return; }
    const ev = JSON.parse(e.data);
    // 🧹 ack discipline: everything the server sent before acknowledging the reset belongs
    // to the chat we just erased (a tool result still on the wire, a denied approval, a
    // late transcript line) — drop it. 4 s safety net in case the ack never arrives.
    if (resetBarrier) {
      if (ev.type === "chat_reset" || Date.now() >= resetBarrier) resetBarrier = 0;
      else if (STALE_ON_RESET.includes(ev.type)) return;
    }
    switch (ev.type) {
      case "session_taken":
        // another window took the slot: say it, and stop pretending this one is live
        onSessionTaken();
        break;
      case "hello":
        fillVoices(ev.voices, ev.voice, ev.rate);
        fillModels(ev.models || [], ev.model, ev.config.llm_via_pi);
        $("piChk").checked = !!ev.config.llm_via_pi;
        $("cmdSel").value = ev.config.cmd_mode || "auto";
        $("bargeChk").checked = ev.config.barge_in;
        $("halfChk").checked = ev.config.half_duplex;
        $("thinkChk").checked = !!ev.config.thinking;
        $("decisionSel").value = ev.config.decision_mode;
        if (ev.rate !== rate && playCtx) { location.reload(); return; }
        rate = ev.rate;
        if (!$("log").children.length) {
          for (const m of ev.history)
            addMsg(m.role === "user" ? "user" : "bot", m.content, undefined, m.id);
          if (!ev.history.length) addEvent(t("msg.ready"));
        }
        if (ev.pending_command) onCommandRequest(ev.pending_command);
        onTasks(ev.tasks || []);                // the banner is right from the first frame
        fillSkills(ev.skills || [], ev.skills_dir);
        setState(ev.state);
        if (ev.context) onContext(ev.context);   // la barra è giusta già dal primo frame
        break;
      case "state": setState(ev.state); break;
      case "partial": $("partial").textContent = ev.text ? "🎤 " + ev.text : ""; break;
      case "user": $("partial").textContent = ""; botBubble = null; thinkBlock = null;
        addMsg("user", ev.text, ev.info, ev.id); break;
      case "reasoning": onReasoning(ev.text); break;      // 💭 collapsed block above the answer
      case "assistant": onReasoningDone(); botAppend(ev.text); break;
      case "assistant_done": onReasoningDone();
        // the line is in the history now: stamp its checkpoint on the bubble ⟲ will use
        if (botBubble && ev.id !== undefined && ev.id !== null) stampLine(botBubble, ev.id);
        botBubble = null; break;  // next answer gets its own bubble
      case "assistant_cancel": onReasoningDone();
        if (botBubble) botBubble.classList.add("cut"); botBubble = null; break;
      case "latency":
        botInfo(tf("ev.latency", { a: ev.first_token_ms, b: ev.first_audio_ms }));
        break;
      case "flush": playerNode && playerNode.port.postMessage({ flush: true }); break;
      case "context": onContext(ev); break;   // barra contesto aggiornata
      case "event": addEvent(ev.text); break;
      case "chat_rewound": onRewound(ev); break;   // ⟲ ack: cut here, from this line on
      case "tasks": onTasks(ev.tasks); break;   // the banner above the chat, whole
      case "tool": onTool(ev); break;
      case "command_request": onCommandRequest(ev); break;
      case "command_resolved": onCommandResolved(); break;
      case "command_start": onCommandStart(ev); break;
      case "command_result": onCommandResult(ev); break;
      case "models": fillModels(ev.models, ev.current, ev.via_pi);
        if (ev.via_pi !== undefined) $("piChk").checked = !!ev.via_pi;
        if (modelRefreshPending) {          // our ↻ got an answer: say so, then stop spinning
          modelRefreshPending = false;
          $("modelRefresh").disabled = false;
          $("modelRefresh").classList.remove("spin");
          addEvent(tf("ev.models", { n: ev.models.length }));
        }
        break;
      case "skills": fillSkills(ev.skills, ev.dir); break;
      case "voices": fillVoices(ev.voices, ev.current, ev.rate || rate); break;
      case "model_loading": $("modelSel").disabled = true;
        addEvent(tf("ev.loading", { m: ev.model })); break;
      case "model_ready": currentModel = ev.model; $("modelSel").disabled = false;
        applyModelFilter();                       // the header shows the model that is live now
        addEvent(tf("ev.ready", { m: ev.model, s: ev.seconds })); break;
      case "model_error": $("modelSel").disabled = false; currentModel = ev.current;
        applyModelFilter();                       // back to the model that is still live
        addEvent(tf("ev.modelError", { m: ev.model, e: ev.error })); break;
    }
  };
}
const send = (obj) => ws && ws.readyState === 1 && ws.send(JSON.stringify(obj));
const setConfig = (key, value) => send({ type: "config", [key]: value });

// ── controls ──
// 🧹 wipes every trace of the current chat, in the DOM *and* in the small buffers that
// live next to it (the tool/command card maps, the live transcript line, the bubble).
function clearChat() {
  $("log").innerHTML = "";
  for (const k in cards) delete cards[k];       // incl. lastReq: no stale card can be reused
  for (const k in toolCards) delete toolCards[k];
  botBubble = null;
  thinkBlock = null;
  $("partial").textContent = "";
}
// event types that are chat content: while waiting for the server's chat_reset ack these
// are old-chat leftovers and must not rebuild a card or a bubble in the fresh log
const STALE_ON_RESET = [
  "user", "assistant", "assistant_done", "assistant_cancel", "partial", "latency",
  "event", "tool", "reasoning", "command_request", "command_resolved", "command_start",
  "command_result",
];
let resetBarrier = 0;   // >0 → ms deadline until which stale events are dropped

function sendText() {
  const input = $("textIn");
  if (takenOver) return;   // no socket: typing here would go nowhere, and say nothing
  if (input.value.trim()) { send({ type: "text", text: input.value }); input.value = ""; }
}

/**
 * Another window took the client slot (`session_taken`, or the close that follows it).
 * The chat stays readable, but the window must stop *looking* interactive: a text box
 * whose every line is silently dropped is worse than one that says it is off.
 */
function onSessionTaken() {
  if (takenOver) return;
  takenOver = true;
  clearTimeout(reconnectTimer);
  setState("offline");
  addEvent(t("msg.replaced"));
  $("textIn").disabled = true;
  $("sendBtn").disabled = true;

  // keep the mic on (and keep pushing frames at a socket that is already closed)
  if (micOn) setMicOn(false);
}

$("sendBtn").onclick = sendText;
// two independent mutes — both icon buttons: `.off` recolours the button *and* swaps
// its glyph (the muted SVG sits in the markup, CSS shows one of the two).
// the mic button (footer) stops the microphone only — the assistant keeps talking;
// the speaker button (header, left of ↻) silences the assistant's voice only —
// the mic keeps listening (the TTS keeps streaming either way, only output is muted)
function setMicOn(on) {
  micOn = on;
  $("micBtn").classList.toggle("off", !on);
  micStream && micStream.getAudioTracks().forEach((track) => (track.enabled = on));
}
function setVoiceOn(on) {
  voiceOn = on;
  $("voiceBtn").classList.toggle("off", !on);
  $("voiceBtn").setAttribute("aria-pressed", String(on));
  if (playerGain && playCtx) playerGain.gain.setTargetAtTime(on ? 1 : 0, playCtx.currentTime, 0.015);
}
$("micBtn").onclick = () => setMicOn(!micOn);
$("voiceBtn").onclick = () => setVoiceOn(!voiceOn);

// ── level-driven pulsing: your voice at the input, the assistant's on its own spot ──
// Ownership is strict: the footer circle reads ONLY the mic (micLvl, ~31 msg/s straight
// from the capture worklet) and the header orb reads ONLY the assistant's output (the RMS
// of what the player is about to emit). While you talk, nothing but your circle moves.
// One rAF loop, fast attack / slower release, so both breathe instead of flickering;
// it only writes one CSS custom property per element (no layout reads, no style thrash).
function playLevel() {
  if (!analyser || !voiceOn) return 0;             // voice muted → no voice to pulse with
  analyser.getFloatTimeDomainData(playTap);
  let s = 0;
  for (let i = 0; i < playTap.length; i++) s += playTap[i] * playTap[i];
  return Math.min(1, Math.sqrt(s / playTap.length) * 4.5);
}

  const dv = dotLvl < 0.001 ? "0" : dotLvl.toFixed(3);
  if (dv !== dotV) { $("talkDot").style.setProperty("--lvl", dv); dotV = dv; }
  const ov = orbLvl < 0.001 ? "0" : orbLvl.toFixed(3);
  if (ov !== orbV) { $("orb").style.setProperty("--lvl", ov); orbV = ov; }
  requestAnimationFrame(dotLoop);
}

$("stopBtn").onclick = () => send({ type: "stop" });
$("resetBtn").onclick = () => {

  clearChat();

// ⚙ hangs from the header's top-right panel and drops the drawer right underneath it:

    $("modelRefresh").classList.remove("spin");
  }, 8000);
};
$("bargeChk").onchange = (e) => setConfig("barge_in", e.target.checked);
$("halfChk").onchange = (e) => setConfig("half_duplex", e.target.checked);
$("aecChk").onchange = (e) => routePlayback(e.target.checked);
$("thinkChk").onchange = (e) => setConfig("thinking", e.target.checked);
$("cmdSel").onchange = (e) => setConfig("cmd_mode", e.target.value);
$("decisionSel").onchange = (e) => setConfig("decision_mode", e.target.value);
$("voiceSel").onchange = (e) => setConfig("tts_voice", e.target.value);
$("piChk").onchange = (e) => setConfig("llm_via_pi", e.target.checked);
$("modelSel").onchange = (e) => pickModel(e.target.value);

/** The user picked a model (click, arrows+Enter, or Enter after typing a fragment). */
function pickModel(picked) {
  if (!picked || picked === FILTER_MARK) { applyModelFilter(); return; } // the query line is not a model
  if (modelQuery) {                      // a pick ends the filter → back to the full list
    modelQuery = "";
    applyModelFilter();
    $("modelSel").value = picked;        // …but the header keeps showing what you picked
  }
  if (picked !== currentModel) send({ type: "model", model: picked });
}

async function start() {
  try {
    await setupAudio();
    $("overlay").style.display = "none";
  } catch (err) {
    console.warn(err);
    $("overlay").style.display = "flex";
  }
}
$("startBtn").onclick = async () => {
  try { await playCtx?.resume(); await micCtx?.resume(); } catch {}
  if (!micCtx) await start();
  if (playCtx && playCtx.state === "running" && micCtx && micCtx.state === "running")
    $("overlay").style.display = "none";
};

connect();
start();
</script>
</body>
