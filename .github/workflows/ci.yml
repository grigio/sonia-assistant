# Type check + lint + the hermetic suites on every push/PR.
#
# `tests/unit` and `tests/ws-skills.test.ts` are self-contained: llama-server and the three
# audio.cpp servers are mocked and the state lives in temp dirs. The only real file either
# reads is `models/silero/silero_vad.onnx` (2.3 MB), fetched with `--only vad` below — the
# ~3.3 GiB of speech models are a separate, opt-in job (`models`).

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: typecheck + lint + unit + websocket tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # strict, no emit — the same gate `bun run test` runs as its pretest.
      # Covers src/, tests/ *and* scripts/ (the stop/run process managers included).
      - name: Type check
        run: bun run typecheck

      # Biome: format + lint over src/, tests/, scripts/ and the GTK4 client.
      - name: Lint
        run: bun run lint

      # The native client has its own tsconfig (and its own deps); types only — no GTK
      # runtime needed here, which is why it can run on this runner too.
      - name: Type check the GTK4 client
        working-directory: sonia-gtk4
        run: |
          bun install --frozen-lockfile
          ../node_modules/.bin/tsc -p tsconfig.json

      # everything the WebSocket suite loads from disk: one package of the model plan
      - name: Fetch the VAD model (2.3 MB)
        run: bun run models-download --only vad

      - name: Unit tests
        run: bun test tests/unit

      - name: WebSocket suite (mocked llama-server + audio.cpp)
        run: bun test tests/ws-skills.test.ts

  # Fetches the full ~3.3 GiB model plan (so a moved/broken mirror is caught here, not on
  # someone's machine) and re-runs the whole suite with the real files present. Opt in with
  # the repository variable WITH_MODELS=true:
  #   Settings → Secrets and variables → Actions → Variables → new: WITH_MODELS = true
  models:
    name: speech models, full suite (opt-in)
    if: ${{ vars.WITH_MODELS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: models
          key: speech-models-${{ hashFiles('scripts/models-download.ts') }}

      - name: Fetch the speech models (~3.3 GiB, resumable)
        run: bun run models-download

      - name: Full suite
        run: bun run test:all

  # The native GTK4 client's Arch package, built from this checkout only (the PKGBUILD
  # reads sonia-gtk4/ and never downloads sources). Runs in an Arch container so `makepkg`
  # is the real thing, and attaches the .pkg.tar.zst to the tag's GitHub release (creating
  # the release if it doesn't exist yet).
  pkg-arch:
    name: Arch package (sonia-gtk4)
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:base-devel
    steps:
      # git has to exist *before* checkout. The base-devel image ships without it, and
      # `actions/checkout` silently falls back to a GitHub REST archive download when it
      # cannot find git — a checkout with the source files but no `.git`. That still builds
      # the package, but the release-notes step then has no repository to log/describe and
      # announces every release as an "Initial release". Installing git first (the only
      # tool checkout needs; the rest are for makepkg) keeps the checkout a real repo.
      - name: Install the tools the steps below need
        run: pacman -Syu --noconfirm --needed git make patch unzip

      # full history + tags: the release notes are generated from the commits between
      # this tag and the previous one
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Release notes = every commit in this tag's range, grouped by conventional-commit
      # type, with the breaking changes called out first. Falls back to a flat list.
      #
      # Finding the *previous* tag takes a few tries. `git describe` is the accurate
      # one (it only matches tags reachable from `<tag>^`), but it needs two things
      # a checkout does not promise: the *objects* behind the tag names, and the
      # parent of the tagging commit. On a shallow fetch `<tag>^` does not even
      # resolve ("Not a valid object name"), so describe answers nothing and the
      # release is announced as an "Initial release" — that is what happened on
      # v0.2.6, even with `fetch-depth: 0` and `fetch-tags: true` in the checkout.
      # So: try, deepen, try again. `--unshallow` pulls the missing history (what
      # actually fixes `<tag>^`); the plain fetch is the no-op when it is not
      # shallow and only the tag refs are missing.
      - name: Build the release notes from the commit messages
        id: notes
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # The workspace is a bind mount: the directory is owned by the runner's uid,
          # while `actions/checkout` (running as root in this container) created `.git`
          # as root. Git therefore sees mismatched ownership and refuses to touch the
          # repo ("detected dubious ownership") unless the path is marked safe in the
          # HOME of *this* step — checkout only did so in a temporary HOME of its own.
          # The package-build step below marks it the same way, for the same reason.
          export PATH="/usr/bin:/usr/sbin:$PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            echo "::error::not usable as a git repository: pwd=$(pwd) git=$(command -v git || echo MISSING)"
            git rev-parse --git-dir || true
            ls -la | head -n 20
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"

          prev=""
          for _ in 1 2 3; do
            # accurate: only tags reachable from the tagging commit's parent
            prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
            [ -n "$prev" ] && break
            # describe needs the tag *objects*; this needs only the refs, and picks the
            # highest version tag that is an ancestor of this one.
            prev="$(git tag --merged "${tag}^" 2>/dev/null | grep -vx "${tag}" | sort -rV | head -n1 || true)"
            [ -n "$prev" ] && break
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --quiet --unshallow --tags --force origin 2>/dev/null || true
            else
              git fetch --quiet --tags --force origin 2>/dev/null || true
            fi
          done

          if [ -n "$prev" ]; then
            range="${prev}..${tag}"
            echo "Release notes: commits in ${range}"
          else
            range="${tag}"
            echo "No previous tag found; using the commits reachable from ${tag}"
          fi

          # type: subject, split on the first colon only (scoped types like feat(ui): count)
          commits() { git log --no-merges --pretty=format:'%s' "$range"; }
          section() { commits | grep -E "^$1(\([^)]*\))?!?:" || true; }

          breaking="$(commits | grep -E '^[a-z]+(\([^)]*\))?!:' || true)"
          feats="$(section 'feat' | grep -vE '^[a-z]+(\([^)]*\))?!:' || true)"
          fixes="$(section 'fix' | grep -vE '^[a-z]+(\([^)]*\))?!:' || true)"
          perf="$(section 'perf' | grep -vE '^[a-z]+(\([^)]*\))?!:' || true)"
          docs="$(section 'docs' | grep -vE '^[a-z]+(\([^)]*\))?!:' || true)"
          chores="$(section 'chore' | grep -vE '^[a-z]+(\([^)]*\))?!:' || true)"

          {
            echo "## What's changed in \`${tag}\`"
            echo
            if [ -n "$prev" ]; then
              echo "_All commits since [\`${prev}\`](../../compare/${prev}...${tag})._"
            else
              echo "_No earlier tag found; listing the commits reachable from this tag._"
            fi
            echo
            emit() { # <heading> <body>
              if [ -n "$2" ]; then
                echo "### $1"
                echo
                echo "$2" | sed 's/^/- /'
                echo
              fi
            }
            emit "⚠️ Breaking changes" "$breaking"
            emit "✨ Features" "$feats"
            emit "🐛 Fixes" "$fixes"
            emit "⚡ Performance" "$perf"
            emit "📚 Docs" "$docs"
            emit "🧹 Chores" "$chores"

            other="$(commits | grep -vE '^(feat|fix|perf|docs|chore|refactor|test|style|build|ci)(\([^)]*\))?!?: ' || true)"
            emit "📦 Other changes" "$other"
          } > release-notes.md

          echo "--- release notes ---"
          cat release-notes.md
          echo "---------------------"

      # the pinned Bun, from the same `.tool-versions` CI uses (BUN_VERSION is honoured
      # by the installer script), so the package builds with the runtime the suites ran on
      - name: Install bun (the runtime, and what the client sources run under)
        run: |
          export BUN_VERSION="$(awk '/^bun /{print $2}' .tool-versions)"
          curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash

      # makepkg refuses to run as root, and container jobs run as root: build as `builder`.
      # The checkout is owned by root, so hand it over too (git needs safe.directory as well).
      - name: Build the package (as a non-root user)
        working-directory: sonia-gtk4/packaging
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # -d: skip the runtime-dependency check (gtk4, pipewire, wireplumber...) —
          # nothing in build()/package() needs them, jsGTK only dlopens GTK4 at run time,
          # and pulling a full PipeWire+GTK4 stack into the container buys nothing here.
          runuser -u builder -- bash -c \
            "cd '$GITHUB_WORKSPACE/sonia-gtk4/packaging' && makepkg -sfd --noconfirm"

      - name: Package contents
        run: tar -tvf sonia-gtk4/packaging/sonia-gtk4-*.pkg.tar.zst

      - name: Attach the package to the release
        uses: softprops/action-gh-release@v2
        with:
          files: sonia-gtk4/packaging/sonia-gtk4-*.pkg.tar.zst
          fail_on_unmatched_files: true
          # the notes generated from the commits; empty releases keep the action's own
          # auto-generated "Full Changelog" fallback
          body_path: release-notes.md
          append_body: true
