# Type check + the hermetic suites on every push/PR.
#
# `tests/unit` and `tests/ws-skills.test.ts` are self-contained: llama-server and the three
# audio.cpp servers are mocked and the state lives in temp dirs. The only real file either
# reads is `models/silero/silero_vad.onnx` (2.3 MB), fetched with `--only vad` below — the
# ~3.3 GiB of speech models are a separate, opt-in job (`models`).

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: typecheck + unit + websocket tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # strict, no emit — the same gate `bun run test` runs as its pretest
      - name: Type check
        run: bun run typecheck

      # everything the WebSocket suite loads from disk: one package of the model plan
      - name: Fetch the VAD model (2.3 MB)
        run: bun run models-download --only vad

      - name: Unit tests
        run: bun test tests/unit

      - name: WebSocket suite (mocked llama-server + audio.cpp)
        run: bun test tests/ws-skills.test.ts

  # Fetches the full ~3.3 GiB model plan (so a moved/broken mirror is caught here, not on
  # someone's machine) and re-runs the whole suite with the real files present. Opt in with
  # the repository variable WITH_MODELS=true:
  #   Settings → Secrets and variables → Actions → Variables → new: WITH_MODELS = true
  models:
    name: speech models, full suite (opt-in)
    if: ${{ vars.WITH_MODELS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: models
          key: speech-models-${{ hashFiles('scripts/models-download.ts') }}

      - name: Fetch the speech models (~3.3 GiB, resumable)
        run: bun run models-download

      - name: Full suite
        run: bun run test:all
